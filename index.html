<!DOCTYPE html> <!--the purpose of this line is to tell the browser that this is an HTML5 document -->
<html lang="af"> <!--this line is the opening tag for the HTML document and specifies the language (currently afrikaans) -->

<head> <!-- basic declaration of head section of the HTML document -->
<meta charset="UTF-8"> <!--this line specifies the character encoding for the document (UTF-8) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--this line sets the viewport to make the website responsive on different devices -->
<title>30 days of JavaScript</title> <!--this line sets the title of the webpage that appears in the browser tab -->

</head> 

<body> <!-- opens the body of the webpage -->
<h1>learning JavaScript with Jayy</h1> <!--this line creates a heading for the webpage -->
<h2>Introduction</h2> <!--this line creates a subheading for the webpage -->
<button onclick="alert('Welcome!!!')">Click Me</button> <!--this line creates a button element on the webpage -->
<script src="./introduction.js"></script> <!--this line links an external JavaScript file (introduction.js) to the HTML document -->



</body>
</html>
